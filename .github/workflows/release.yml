name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - name: Checksum
        shell: pwsh
        run: Get-FileHash dist\TradeDesk-Setup-*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } | Out-File dist\SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TradeDesk-installer
          path: |
            dist/TradeDesk-Setup-*.exe
            dist/SHA256.txt
